name: Alpine Incus compatibility runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/test-incus-sysinfo-compat.sh'
      - 'scripts/prepare-incus-compat.mjs'
      - 'scripts/build-incus-sysinfo-compat.py'
      - 'scripts/incus-memory-default.go'
      - 'scripts/incus-memory-default_test.go'
      - 'scripts/incus-native-memory.go'
      - 'scripts/incus-raft-memory.go'
      - 'scripts/incus-raft-memory_test.go'
      - 'scripts/test-incus-memory-runtime.go'
      - 'agent/internal/provisioning/**'
      - 'agent/internal/memorybudget/**'
      - '.github/workflows/incus-sysinfo-native.yml'
jobs:
  compatibility-build:
    uses: ./.github/workflows/incus-sysinfo-compat.yml
  runtime:
    needs: compatibility-build
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario: [normal, prepared-resume, rollback-retry, empty-pool, btrfs-rebuild, previous-generation]
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Download independently verified fixed-source compatibility build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name incudal-incusd-sysinfo-${{ matrix.architecture }} --dir output
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('output');m=json.loads((p/'incusd-manifest.json').read_text());b=(p/'incusd').read_bytes()
          assert m['sourceSha256']=='f57dcf2b781f6664b04b264e680d6b05a86303bbee717161110282e2a8891486'
          assert m['patchedSourceSha256']=='501bf2ce32a2078bc8b99913f5e17f25ad621f1ff79c3d22a98a44bd2bc4b1d6'
          assert m['lifecycleSourceSha256']=='819e0462aa64e4147520a8686b55f52f2ca6761b69fdb6058e8caa946741f637'
          assert m['memorySourceSha256']=='56b95831a97677406958326f0a2d42a1aebc4589ebab8c616d9e735df2194f63'
          assert m['memoryNamespaceSourceSha256']=='917e33a02226b436dd6724c59fdc04735cc7958a1ffa33bd80f5084b39fa2ed1'
          assert m['securityModulesScriptSha256']=='025e7a6456f97e4b28fad8d2d2b437cc177452001e65248345158f914f07c4a3'
          assert m['memoryRaftSourceSha256']=='08af4c3ed863c1b7ce25d95aed06ab6ac9eb4d8e95f1c5884b7f699ab6151dce'
          assert m['memoryBuildDefault']=='disablethp=1' and m['memoryBudgetRevision']=='daemon-memory-v3'
          assert hashlib.sha256(b).hexdigest()==m['sha256'] and len(b)==m['size']
          PY
      - name: Original daemon reload retains guest and corrects real sysinfo
        run: |
          set -euo pipefail
          GH_TOKEN='${{ github.token }}' INCUS_COMPAT_BUILD_RUN='${{ github.run_id }}' node scripts/prepare-incus-compat.mjs
          (cd agent && CGO_ENABLED=0 go test -c -o ../output/provisioning-test ./internal/provisioning)
          (cd agent && CGO_ENABLED=0 go test -c -o ../output/memory-budget-test ./internal/memorybudget)
          (cd agent && go test ./internal/memorybudget && go vet ./internal/memorybudget ./internal/provisioning)
          arch=x86_64; digest=cdaa38cb8de3537967ee5b6c9b6cd00cc962da2b018e6eea48696bb274923012
          if [[ '${{ matrix.architecture }}' == arm64 ]]; then arch=aarch64; digest=4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de; fi
          root=$(mktemp -d)
          curl -fsSLo alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/$arch/alpine-minirootfs-3.24.4-$arch.tar.gz"
          printf '%s  alpine.tar.gz\n' "$digest" | sha256sum -c -
          sudo tar -xzf alpine.tar.gz -C "$root"
          sudo cp /etc/resolv.conf "$root/etc/resolv.conf"
          sudo mkdir -p "$root/out"
          sudo cp output/incusd "$root/out/incusd"
          sudo cp output/provisioning-test "$root/out/provisioning-test"
          sudo cp output/memory-budget-test "$root/out/memory-budget-test"
          sudo chmod 755 "$root/out/provisioning-test"
          sudo cp scripts/test-incus-sysinfo-compat.sh "$root/test.sh"
          sudo mount --rbind /dev "$root/dev"
          sudo mount --make-rslave "$root/dev"
          sudo mount -t proc proc "$root/proc"
          sudo mount --rbind /sys "$root/sys"
          sudo mount --make-rslave "$root/sys"
          # Ubuntu restricts user namespaces for the Alpine chroot executable,
          # which has no Ubuntu AppArmor profile. Only this disposable runtime
          # fixture adjusts that host restriction; product rules stay intact.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo env INCUDAL_SYSINFO_COMPAT_TEST=disposable INCUDAL_COMPAT_RELOAD_SCENARIO='${{ matrix.scenario }}' unshare --mount --propagation private /bin/bash -c '
            mount --rbind "$1" "$1"
            cd "$1"
            mkdir .oldroot
            pivot_root . .oldroot
            exec /bin/sh -ec "umount -l /.oldroot; mount -t proc proc /proc; apk add --no-cache go; sh /test.sh"
          ' -- "$root"
