name: Host memory pressure runtime

concurrency:
  group: payincus-memory-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/internal/memorybudget/**'
      - 'agent/internal/provisioning/**'
      - 'agent/internal/localincus/**'
      - 'agent/internal/guestguard/**'
      - 'agent/internal/dedicatedipv6/**'
      - 'agent/cmd/incudal-agent/main.go'
      - 'scripts/incus-memory-default.go'
      - 'scripts/incus-memory-default_test.go'
      - 'scripts/incus-native-memory.go'
      - 'scripts/incus-raft-memory.go'
      - 'scripts/incus-raft-memory_test.go'
      - 'scripts/test-incus-memory-runtime.go'
      - 'scripts/build-incus-sysinfo-compat.py'
      - 'scripts/prepare-incus-compat.mjs'
      - 'scripts/test-host-memory-pressure.py'
      - 'scripts/test-incus-raft-retention.py'
      - 'scripts/test-incus-raft-recovery.py'
      - 'scripts/host-memory-holder.go'
      - 'scripts/enter-host-memory-pressure.sh'
      - 'scripts/setup-host-memory-pressure.sh'
      - '.github/workflows/host-memory-native.yml'
jobs:
  compatibility-build:
    uses: ./.github/workflows/incus-sysinfo-compat.yml
  memory:
    needs: compatibility-build
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        tuning: [automatic, explicit-daemon-settings]
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            digest: cdaa38cb8de3537967ee5b6c9b6cd00cc962da2b018e6eea48696bb274923012
          - runner: ubuntu-24.04-arm
            arch: aarch64
            digest: 4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Prepare same fixed-source daemon and full Agent
        env:
          GH_TOKEN: ${{ github.token }}
          INCUS_COMPAT_BUILD_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/prepare-incus-compat.mjs
          mkdir -p output
          (cd agent && CGO_ENABLED=0 go build -o ../output/incudal-agent ./cmd/incudal-agent)
          (cd agent && CGO_ENABLED=0 go test -c -o ../output/provisioning-test ./internal/provisioning)
          CGO_ENABLED=0 go build -o output/memory-holder scripts/host-memory-holder.go
      - name: Native Alpine aggregate 966MiB and customer 768MiB
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          root=$(mktemp -d)
          curl -fsSLo alpine.tar.gz 'https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/${{ matrix.arch }}/alpine-minirootfs-3.24.4-${{ matrix.arch }}.tar.gz'
          printf '${{ matrix.digest }}  alpine.tar.gz\n' | sha256sum -c -
          sudo tar -xzf alpine.tar.gz -C "$root"
          sudo cp /etc/resolv.conf "$root/etc/resolv.conf"
          # Chroot uses the runner kernel: give modprobe that exact kernel's
          # signed distro modules, rather than an unrelated Alpine kernel.
          sudo mkdir -p "$root/lib/modules"
          sudo mount --bind /lib/modules "$root/lib/modules"
          sudo modprobe fuse
          sudo modprobe btrfs
          sudo modprobe dm_thin_pool
          sudo mkdir -p "$root/out"
          sudo cp output/* "$root/out/"
          sudo cp scripts/test-host-memory-pressure.py "$root/out/pressure.py"
          sudo cp scripts/test-incus-raft-retention.py "$root/out/raft-retention.py"
          sudo cp scripts/test-incus-raft-recovery.py "$root/out/raft-recovery.py"
          sudo cp scripts/setup-host-memory-pressure.sh "$root/out/setup.sh"
          sudo mount --rbind /dev "$root/dev"
          sudo mount --make-rslave "$root/dev"
          sudo mount -t proc proc "$root/proc"
          sudo mount --rbind /sys "$root/sys"
          sudo mount --make-rslave "$root/sys"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Fixture only: reproduce the production THP setting without altering
          # product/customer policy. Swap covers host pages, never guest pages.
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          sudo fallocate -l 1G /tmp/memory-fixture.swap
          sudo chmod 600 /tmp/memory-fixture.swap
          sudo mkswap /tmp/memory-fixture.swap
          sudo swapon /tmp/memory-fixture.swap
          group=/sys/fs/cgroup/incudal-memory-fixture
          sudo mkdir "$group" "$group/host"
          echo $((966*1024*1024)) | sudo tee "$group/memory.max"
          echo $((1024*1024*1024)) | sudo tee "$group/memory.swap.max"
          sudo env INCUDAL_SYSINFO_COMPAT_TEST=disposable INCUDAL_COMPAT_RELOAD_SCENARIO=empty-pool INCUDAL_MEMORY_PRESSURE_TEST=disposable INCUDAL_MEMORY_CGROUP="$group" INCUDAL_MEMORY_TUNING='${{ matrix.tuning }}' bash -c '
            echo $$ > "$2/cgroup.procs"
            exec unshare --mount --propagation private bash "$3" "$1" "$2"
          ' -- "$root" "$group" "$PWD/scripts/enter-host-memory-pressure.sh"
